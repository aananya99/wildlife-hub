<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife hub</title>
    <link rel="shortcut icon" href="./assests/icon_lion.png" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- hero section -->
    <section
      class="w-full py-16 md:py-24 bg-cover bg-center bg-no-repeat relative"
      style="background-image: url(./assests/banner_1.jpg)"
    >
      <!-- Dark Overlay -->
      <div class="absolute inset-0 bg-black/50"></div>
      <div
        class="relative flex flex-col space-y-3 items-center h-full p-5 text-center"
      >
        <h2 class="text-3xl md:text-5xl text-white mt-5 font-bold">
          Wildlife Hub
        </h2>
        <h4 class="text-lg md:text-2xl text-white">
          Discover Amazing Animals Around the World
        </h4>
        <p class="text-sm text-gray-100">
          Explore information about mammals, birds, reptiles and marine life.
        </p>
        <button
          id="btn-explore"
          class="btn mt-5 rounded-xl  text-green-700 hover:bg-green-50"
        >
          Explore Animals
          <i class="fa-regular fa-circle-right text-xl"></i>
        </button>
      </div>
    </section>
    <!-- search section -->
    <section class="max-w-7xl mx-5 md:mx-auto mt-5 p-5">
      <div class="flex flex-col space-y-3 items-center">
        <h2 class="text-2xl text-green-700 font-semibold">Search Animal</h2>
        <label class="input w-full max-w-md">
          <svg
            class="h-[1em] opacity-50"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <g
              stroke-linejoin="round"
              stroke-linecap="round"
              stroke-width="2.5"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </g>
          </svg>
          <input
            id="search-input"
            type="search"
            required
            placeholder="Search by name..."
          />
        </label>
        <p id="error-msg" class="hidden text-xl text-red-500 font-semibold">
          Failed to Load Animals
        </p>
        <p id="count-msg" class="text-xl font-semibold text-green-700"></p>
        <p id="no-match" class="hidden text-xl text-red-500 font-semibold">
          No Animals Found
        </p>
      </div>
    </section>
    <!-- filter section  -->
    <section class="max-w-7xl mx-5 md:mx-auto bg-gray-100 mt-12 py-10 px-5">
      <div class="flex flex-wrap gap-3 justify-center items-center">
        <button
          id="all"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          All
        </button>
        <button
          id="mammals"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          Mammals
        </button>
        <button
          id="birds"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          Birds
        </button>
        <button
          id="reptiles"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          Reptiles
        </button>
        <button
          id="marine"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          Marine
        </button>
        <button
          id="amphibian"
          class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl hover:bg-green-100 active:scale-95"
        >
          Amphibian
        </button>
      </div>
      <div class="flex justify-center mt-5">
        <!-- sort -->
        <select id="sort-select" class="select border-green-700" name="">
          <option value="">Sort By Name</option>
          <option value="az">A-Z</option>
          <option value="za">Z-A</option>
        </select>
      </div>
    </section>
    <!-- card section -->
    <section class="max-w-7xl mx-5 md:mx-auto mt-12">
      <dialog id="animal-modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
          <h3 class="text-2xl font-bold text-center text-green-700 mb-4">
            Animal Details
          </h3>
          <div id="modal-content"></div>
          <div class="modal-action">
            <form method="dialog">
              <button
                class="btn border-2 border-green-700 text-green-700 bg-white rounded-xl active:scale-95"
              >
                Close
              </button>
            </form>
          </div>
        </div>
      </dialog>

      <div
        id="card-container"
        class="bg-slate-50 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-5 p-3 md:p-10"
      >
        <!-- card -->
      </div>
    </section>
    <!-- footer -->
    <section class="w-full">
      <footer
        class="footer sm:footer-horizontal footer-center bg-linear-to-r from-green-500 to-green-600 text-white mt-12.5 p-4"
      >
        <aside>
          <h2 class="text-xl font-semibold">WildLife Hub</h2>
          <p>Made with ❤ using HTML, CSS and JavaScript</p>
        </aside>
      </footer>
    </section>
    <script src="javaScript/index.js"></script>
  </body>
</html>
